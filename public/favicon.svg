<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="15" fill="#0a0a0a"/>

  <!-- Rising sun -->
  <circle cx="32" cy="32" r="13" fill="url(#sun)"/>

  <!-- Katana (drawn vertically, rotated to a diagonal draw stroke) -->
  <g transform="rotate(-45 32 32)">
    <!-- Blade -->
    <polygon points="32,5 33.3,10 33.3,33 30.7,33 30.7,10" fill="url(#steel)"/>
    <!-- Shinogi shine line -->
    <line x1="32" y1="8" x2="32" y2="33" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
    <!-- Guard (tsuba) -->
    <rect x="26" y="33" width="12" height="2.8" rx="1.4" fill="#c8a24a"/>
    <!-- Grip (tsuka) -->
    <rect x="30.2" y="36.4" width="3.6" height="14" rx="1.6" fill="#171310"/>
    <!-- Pommel -->
    <rect x="30" y="50" width="4" height="2.4" rx="1.2" fill="#c8a24a"/>
  </g>

  <defs>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0%" stop-color="#ff6470"/>
      <stop offset="100%" stop-color="#e63946"/>
    </radialGradient>
    <linearGradient id="steel" x1="30" y1="5" x2="34" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dce1e8"/>
      <stop offset="100%" stop-color="#aab2be"/>
    </linearGradient>
  </defs>
</svg>
